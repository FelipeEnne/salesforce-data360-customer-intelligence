services:
  postgres:
    image: postgres:17@sha256:0b657ff48d7f76a1e907f381b1693eb4f2bf54c1d2df4feb6743d7dc601768dd
    container_name: data360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: data360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: customer360
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data360 -d customer360"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
